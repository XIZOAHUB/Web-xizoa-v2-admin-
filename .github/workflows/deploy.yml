name: 🚀 Deploy Mission Control

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger bhi ho sake

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # ─── STEP 1: Checkout Code ───
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ─── STEP 2: Setup Node.js ───
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ─── STEP 3: Install Wrangler ───
      - name: 📦 Install Wrangler
        run: npm install -g wrangler

      # ─── STEP 4: Create wrangler.toml (Auto) ───
      - name: 📝 Generate wrangler.toml
        run: |
          cat > wrangler.toml << 'EOF'
          name = "mission-control"
          main = "src/index.js"
          compatibility_date = "2026-08-10"

          [[kv_namespaces]]
          binding = "ADMIN_KV"
          id = "${{ secrets.CF_KV_NAMESPACE_ID }}"

          [vars]
          GITHUB_API = "https://api.github.com"
          SITE_URL = "https://xizoa.com"
          ADMIN_URL = "https://admin-v2-login-space.xizoa.com"
          EOF

      # ─── STEP 5: Deploy to Cloudflare ───
      - name: 🚀 Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          # Secrets as environment variables pass karo
          echo "Deploying to Cloudflare..."
          wrangler deploy --var GITHUB_TOKEN:${{ secrets.GH_PAT }} --var JWT_SECRET:${{ secrets.JWT_SECRET }}

      # ─── STEP 6: Verify Deploy ───
      - name: ✅ Verify Deployment
        run: |
          echo "Deployed to: https://admin-v2-login-space.xizoa.com"
          curl -s -o /dev/null -w "%{http_code}" https://admin-v2-login-space.xizoa.com || true
